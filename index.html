      justify-content: center;
      border-radius: 50%;

    // === FIREBASE: подписка на записи ===
    let unsubscribeDiary = null;

    function subscribeToDiary() {
      const fb = window.firebaseDB;
      if (!fb) {
        diaryList.innerHTML = '<p class="diary-loading">Загрузка Firebase...</p>';
        setTimeout(subscribeToDiary, 500);
        return;
      }

      if (unsubscribeDiary) unsubscribeDiary();

      const q = fb.query(fb.collection(fb.db, 'diary'), fb.orderBy('timestamp', 'desc'));
      unsubscribeDiary = fb.onSnapshot(q, (snapshot) => {
        allEntries = [];
        snapshot.forEach(docSnap => {
          const data = docSnap.data();
          allEntries.push({
            id: docSnap.id,
            text: data.text || '',
            date: data.date || '',
            timestamp: data.timestamp,
            reactions: data.reactions || {}
          });
        });
        renderDiary();
        renderCalendar();
      }, (error) => {
        console.error('Firebase error:', error);
        diaryList.innerHTML = '<p class="diary-loading">Ошибка загрузки. Проверь настройки Firebase.</p>';
      });
    }

    // === Сохранение записи ===
    diarySaveBtn.addEventListener('click', async () => {
      const text = diaryInput.value.trim();
      if (!text) return;

      const fb = window.firebaseDB;
      if (!fb) {
        alert('Firebase ещё не загрузился. Подожди пару секунд.');
        return;
      }

      const now = new Date();
      const dateStr = now.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' }) +
        ', ' + now.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
      const dateKey = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0') + '-' + String(now.getDate()).padStart(2, '0');

      try {
        await fb.addDoc(fb.collection(fb.db, 'diary'), {
          text: text,
          date: dateStr,
          dateKey: dateKey,
          timestamp: fb.serverTimestamp(),
          author: myUserId,
          reactions: {}
        });
        diaryInput.value = '';
        burstHearts(10);
        if (window.Telegram && window.Telegram.WebApp) {
          window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');

      } catch (e) {
        console.error('Save error:', e);
        alert('Не удалось сохранить. Проверь правила Firestore.');
      }
    });

    // === Отображение списка записей ===

      diaryList.innerHTML = '';

      let entriesToShow = allEntries;

      const fragment = document.createDocumentFragment();
      entriesToShow.forEach(entry => {
        const item = document.createElement('div');
        item.className = 'diary-item';

        const dateEl = document.createElement('div');
        dateEl.className = 'diary-date';
        dateEl.textContent = entry.date;

        // Реакции
        const reactionsWrap = document.createElement('div');

        REACTIONS.forEach(emoji => {
          const users = entry.reactions[emoji] || [];
          const count = users.length;
          const isMine = users.includes(myUserId);

          const rBtn = document.createElement('button');
          rBtn.type = 'button';
          rBtn.className = 'reaction-btn' + (isMine ? ' active' : '');
          rBtn.innerHTML = `<span>${emoji}</span>${count > 0 ? `<span class="reaction-count">${count}</span>` : ''}`;

          rBtn.addEventListener('click', async () => {
            const fb = window.firebaseDB;
            if (!fb) return;
            const entryRef = fb.doc(fb.db, 'diary', entry.id);
            const currentUsers = entry.reactions[emoji] || [];

            try {
              if (isMine) {
                await fb.updateDoc(entryRef, {
                  ['reactions.' + emoji]: fb.arrayRemove(myUserId)
                });
              } else {
                await fb.updateDoc(entryRef, {
                  ['reactions.' + emoji]: fb.arrayUnion(myUserId)
                });
              }
              if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
              }
            } catch (e) {
              console.error('Reaction error:', e);
            }
          });

          reactionsWrap.appendChild(rBtn);
        });

        item.appendChild(dateEl);
        item.appendChild(textEl);
        item.appendChild(reactionsWrap);

        // Удаление (только если это твоя запись или автора нет)
        if (entry.author === myUserId || !entry.author) {
          const delBtn = document.createElement('button');

    // === КАЛЕНДАРЬ ===
    const MONTH_NAMES = ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
    const DAY_NAMES = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];

    function renderCalendar() {
      calendarMonth.textContent = MONTH_NAMES[currentMonth] + ' ' + currentYear;

      const firstDay = new Date(currentYear, currentMonth, 1);
      const lastDay = new Date(currentYear, currentMonth + 1, 0);
      const daysInMonth = lastDay.getDate();
      const startWeekday = (firstDay.getDay() + 6) % 7; // Пн=0

      const today = new Date();
      const todayKey = today.getFullYear() + '-' + String(today.getMonth() + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');

      // Дни с записями
      const daysWithEntries = new Set();
      allEntries.forEach(e => { if (e.dateKey) daysWithEntries.add(e.dateKey); });

      calendarGrid.innerHTML = '';

        d.className = 'calendar-day-name';

      for (let i = 0; i < startWeekday; i++) {
        const empty = document.createElement('div');
        calendarGrid.appendChild(empty);

      // Дни месяца
      for (let day = 1; day <= daysInMonth; day++) {

          renderDiary();

    function burstHeartsAt(originX, originY, count = 12) {
      if (prefersReducedMotion) return;
      const emojis = ['❤️', '💖', '💕', '💗', '💓', '💞', '✨'];
      const fragment = document.createDocumentFragment();
      const created = [];

      for (let i = 0; i < count; i++) {
        const heart = document.createElement('div');
        heart.className = 'burst-heart';
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = originX + 'px';
        heart.style.top = originY + 'px';
        heart.style.fontSize = (18 + Math.random() * 18) + 'px';
        heart.style.transform = 'translate(-50%, -50%) scale(1)';
        heart.style.opacity = '1';
        heart.style.transition = 'transform 1.2s cubic-bezier(0.25, 0.8, 0.4, 1), opacity 1.2s ease-out';
        fragment.appendChild(heart);
        created.push(heart);
      }
      document.body.appendChild(fragment);

      created.forEach(heart => {
        const angle = Math.random() * Math.PI * 2;
        const distance = 100 + Math.random() * 180;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance - 100;

        requestAnimationFrame(() => {
          heart.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.5) rotate(${Math.random() * 360}deg)`;
          heart.style.opacity = '0';
        });
        setTimeout(() => heart.remove(), 1400);
      });
    }

    function burstHearts(count = 12) {
      const rect = btn.getBoundingClientRect();
      burstHeartsAt(rect.left + rect.width / 2, rect.top + rect.height / 2, count);

      const h = new Date().getHours();
      document.body.classList.remove('theme-day', 'theme-night', 'theme-evening');

      if (h >= 6 && h < 18) {
        document.body.classList.add('theme-day');

      } else if (h >= 18 && h < 22) {
        document.body.classList.add('theme-evening');
        if (meta) meta.setAttribute('content', '#d64d6d');
      } else {
        document.body.classList.add('theme-night');

        h.className = 'heart-bg';
        h.textContent = bgHearts[Math.floor(Math.random() * bgHearts.length)];
        h.style.left = Math.random() * 100 + '%';
        h.style.fontSize = (14 + Math.random() * 24) + 'px';
        h.style.animationDuration = (10 + Math.random() * 10) + 's';
        h.style.animationDelay = (Math.random() * 12) + 's';
        fragment.appendChild(h);
      }
      document.body.appendChild(fragment);
    }

    const ourPhoto = document.getElementById('ourPhoto');
    ourPhoto.addEventListener('error', function onPhotoError() {
      this.removeEventListener('error', onPhotoError);
      this.style.display = 'none';
      const fallback = document.createElement('span');
      fallback.className = 'photo-fallback';
      fallback.textContent = '❤️';
      this.insertAdjacentElement('afterend', fallback);
    }, { once: true });

    const photoFrame = document.getElementById('photoFrame');
    let lastTap = 0;
    function photoBurst() {
      const rect = photoFrame.getBoundingClientRect();
      burstHeartsAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 18);
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
      }
    }
    photoFrame.addEventListener('dblclick', photoBurst);
    photoFrame.addEventListener('touchend', () => {
      const now = Date.now();
      if (now - lastTap < 300) photoBurst();
      lastTap = now;
    }, { passive: true });

    // ========== ВТОРАЯ СТРАНИЦА / ПЛЕЕР ==========
    const page2 = document.getElementById('page2');
    const backBtn = document.getElementById('backBtn');
    const songPlayer = document.getElementById('songPlayer');
    const lyricText = document.getElementById('lyricText');
    const finalScreen = document.getElementById('finalScreen');
    const replayBtn = document.getElementById('replayBtn');
    const finalExitBtn = document.getElementById('finalExitBtn');

    const seekRange = document.getElementById('seekRange');
    const curTimeEl = document.getElementById('curTime');
    const durTimeEl = document.getElementById('durTime');
    const playPauseBtn = document.getElementById('playPauseBtn');
    const skipBackBtn = document.getElementById('skipBackBtn');
    const skipFwdBtn = document.getElementById('skipFwdBtn');
    const songVolBtn = document.getElementById('songVolBtn');

    const LYRICS = [
      { time: 14,   text: "Детка, на мне висит метка, я — твоя мишень" },
      { time: 17,   text: "Ты — конфетка в упаковке среди муляжей" },
      { time: 21,   text: "Я приму твой выстрел, не могу терпеть уже" },
      { time: 24,   text: "Целься в сердце, чтобы оно перестало жечь" },
      { time: 28,   text: "Детка, ты карамель-карамель" },
      { time: 29,   text: "Опутала туго чарами-чарами" },
      { time: 31,   text: "Душа кричит, будто фа-до-соль-ре-ля-ми" },
      { time: 33,   text: "Губы твои стали алыми-алыми" },
      { time: 34,   text: "Выпью тебя, и до талого мало мне" },
      { time: 36,   text: "Мир на миг стал безлик, а мы бокалами" },
      { time: 38,   text: "Ловим те капли, что самыми-самыми" },
      { time: 40,   text: "Станут для нас и залечат все раны нам" },
      { time: 42,   text: "Детка, детка, детка, уа-уэй" },
      { time: 46,   text: "Я хочу, чтоб ты была моей" },
      { time: 49,   text: "Пока летаем, тает ночь и день" },
      { time: 53,   text: "Она — удача, я бегу за ней 💫" },
      { time: 56,   text: "Как делишки, детка, где твоя улыбка?" },
      { time: 58,   text: "Ты мой джекпот, я кричу: «Бинго!», детка, нахер Тиндер" },
      { time: 62,   text: "Заполонила меня моя половинка" },
      { time: 65,   text: "Мы крутим love, и кружим в ритме, нам не нужен ***" },
      { time: 69,   text: "Как делишки у моей малышки, алло?" },
      { time: 73,   text: "Как делишки у моей малышки, алло?" },
      { time: 76,   text: "Как делишки у моей малышки, алло?" },
      { time: 80,   text: "Как делишки у моей малышки? Я, я!" },
      { time: 83,   text: "Как делишки у моей малышки, алло?" },
      { time: 86,   text: "Как делишки у моей малышки, алло?" },
      { time: 90,   text: "Как делишки у моей малышки, алло?" },
      { time: 93,   text: "Как делишки у моей малышки? Я, я!" },
      { time: 96,   text: "Так часто снишься, о тебе все мои мысли" },
      { time: 100,  text: "Где мы на радуге зависли, солнца брызги на ней" },
      { time: 103,  text: "В тебе сок есть, налей, в унисон акварель" },
      { time: 107,  text: "Мы пишем наши чувства кляксами из ярких, бэй" },
      { time: 110,  text: "Распахни мне сердце, будто раскладушка-сотик" },
      { time: 113,  text: "И я нажму на твои кнопки, если ты не против" },
      { time: 117,  text: "Мы крутим против часовой, детка, ты мой ***котик" },
      { time: 120,  text: "Я называю это «love», звучит неплохо вроде" },
      { time: 123,  text: "Я не катаюсь с тобой в метро, ведь ты бомба" },
      { time: 128,  text: "Мы выше всех, моя малышка — вышка" },
      { time: 130,  text: "По вечерам провожать её прямо до дома" },
      { time: 135,  text: "Так клёво, так клёво" },
      { time: 137,  text: "О нас поют во дворе кошки, малышка" },
      { time: 140,  text: "Луной свечу тебе в окошко, пока спишь ты" },
      { time: 144,  text: "В тебе есть чуитс, ты красива, даже слишком" },
      { time: 147,  text: "Ну, как делишки, детка-детка, как делишки? Е-е" },
      { time: 151,  text: "Как делишки у моей малышки, алло?" },
      { time: 155,  text: "Как делишки у моей малышки, алло?" },
      { time: 158,  text: "Как делишки у моей малышки, алло?" },
      { time: 162,  text: "Как делишки у моей малышки? Я, я!" },
      { time: 165,  text: "Как делишки у моей малышки, алло?" },
      { time: 169,  text: "Как делишки у моей малышки, алло?" },
      { time: 173,  text: "Как делишки у моей малышки, алло?" },
      { time: 176,  text: "Как делишки у моей малышки? Я, я!" }
    ];

    let lyricIndex = 0;
    let progressRafId = null;
    let lastShownIndex = -1;
    let finalShown = false;
    let isSeeking = false;
    let songMuted = false;
    const SYNC_WINDOW = 0.6;

    function showLyric(index) {
      if (index >= LYRICS.length) return;
      const nextText = LYRICS[index].text;
      lyricText.classList.remove('show');
      setTimeout(() => {
        lyricText.textContent = nextText;
        void lyricText.offsetWidth;
        lyricText.classList.add('show');
      }, 250);
    }

    function resyncLyricsToTime(t) {
      let idx = -1;
      for (let i = 0; i < LYRICS.length; i++) {
        if (t >= LYRICS[i].time - SYNC_WINDOW) idx = i;
        else break;
      }
      lastShownIndex = idx;
      lyricIndex = idx + 1;
      if (idx >= 0) {
        lyricText.textContent = LYRICS[idx].text;
        void lyricText.offsetWidth;
        lyricText.classList.add('show');
      } else {
        lyricText.classList.remove('show');
        lyricText.textContent = '';
      }
    }

    function updatePlayIcon() {
      playPauseBtn.textContent = songPlayer.paused ? '▶️' : '⏸️';
    }
    songPlayer.addEventListener('play', updatePlayIcon);
    songPlayer.addEventListener('pause', updatePlayIcon);

    playPauseBtn.addEventListener('click', () => {
      if (songPlayer.paused) {
        songPlayer.play().catch(() => {});
      } else {
        songPlayer.pause();
      }
    });

    skipBackBtn.addEventListener('click', () => {
      songPlayer.currentTime = Math.max(0, songPlayer.currentTime - 10);
      resyncLyricsToTime(songPlayer.currentTime);
    });
    skipFwdBtn.addEventListener('click', () => {
      const dur = isFinite(songPlayer.duration) ? songPlayer.duration : songPlayer.currentTime + 10;
      songPlayer.currentTime = Math.min(dur, songPlayer.currentTime + 10);
      resyncLyricsToTime(songPlayer.currentTime);
    });

    songVolBtn.addEventListener('click', () => {
      songMuted = !songMuted;
      songPlayer.muted = songMuted;
      songVolBtn.textContent = songMuted ? '🔇' : '🔊';
    });

    songPlayer.addEventListener('loadedmetadata', () => {
      if (isFinite(songPlayer.duration)) {
        durTimeEl.textContent = formatTime(songPlayer.duration);
      }
    });

    seekRange.addEventListener('input', () => {
      isSeeking = true;
      if (isFinite(songPlayer.duration) && songPlayer.duration > 0) {
        curTimeEl.textContent = formatTime((seekRange.value / 100) * songPlayer.duration);
      }
    });
    seekRange.addEventListener('change', () => {
      if (isFinite(songPlayer.duration) && songPlayer.duration > 0) {
        songPlayer.currentTime = (seekRange.value / 100) * songPlayer.duration;
        resyncLyricsToTime(songPlayer.currentTime);
      }
      isSeeking = false;
    });

    function showFinal() {
      if (finalShown) return;
      finalShown = true;
      songPlayer.pause();
      finalScreen.classList.add('active');
      finalBurstHearts(40);
      if (window.Telegram && window.Telegram.WebApp) {
        window.Telegram.WebApp.HapticFeedback.notificationOccurred('success');
      }
    }

    function hideFinal() {
      finalScreen.classList.remove('active');
      finalShown = false;
    }

    function updateSongProgress() {
      if (!page2.classList.contains('active') || document.hidden) {
        progressRafId = null;
        return;
      }

      const currentTime = songPlayer.currentTime;

      if (!isSeeking && songPlayer.duration && isFinite(songPlayer.duration)) {
        seekRange.value = (currentTime / songPlayer.duration) * 100;
        curTimeEl.textContent = formatTime(currentTime);
      }

      while (lyricIndex < LYRICS.length) {
        const lyric = LYRICS[lyricIndex];
        if (currentTime >= lyric.time - SYNC_WINDOW) {
          if (lyricIndex !== lastShownIndex) {
            showLyric(lyricIndex);
            lastShownIndex = lyricIndex;
          }
          lyricIndex++;
        } else {
          break;
        }
      }

      if (songPlayer.duration && isFinite(songPlayer.duration) && !finalShown) {
        if (currentTime >= songPlayer.duration - 0.5 || songPlayer.ended) {
          showFinal();
        }
      }

      progressRafId = requestAnimationFrame(updateSongProgress);
    }

    document.addEventListener('visibilitychange', () => {
      if (!document.hidden && page2.classList.contains('active') && !progressRafId) {
        progressRafId = requestAnimationFrame(updateSongProgress);
      }
    });

    function openPage2() {
      music.pause();

      page2.classList.add('active');
      page2.scrollTop = 0;
      backBtn.classList.add('show');
      hideFinal();
      songPlayer.volume = 0.85;
      songPlayer.muted = songMuted;
      songPlayer.currentTime = 0;
      lyricIndex = 0;
      lastShownIndex = -1;
      lyricText.classList.remove('show');
      lyricText.textContent = '';
      seekRange.value = 0;
      curTimeEl.textContent = '0:00';
      durTimeEl.textContent = '0:00';

      const startSong = () => {
        songPlayer.play().then(updatePlayIcon).catch(() => {
          updatePlayIcon();
          const resumeOnTap = () => {
            songPlayer.play().then(updatePlayIcon).catch(() => {});
            document.removeEventListener('touchstart', resumeOnTap);
            document.removeEventListener('click', resumeOnTap);
          };
          document.addEventListener('touchstart', resumeOnTap, { once: true, passive: true });
          document.addEventListener('click', resumeOnTap, { once: true });
        });
      };
      startSong();

      setTimeout(() => {
        if (LYRICS.length > 0) {
          lyricText.textContent = LYRICS[0].text;
          void lyricText.offsetWidth;
          lyricText.classList.add('show');
          lastShownIndex = 0;
          lyricIndex = 1;
        }
      }, 400);

      if (!progressRafId) {
        progressRafId = requestAnimationFrame(updateSongProgress);
      }
    }

    function closePage2() {
      page2.classList.remove('active');
      backBtn.classList.remove('show');
      songPlayer.pause();
      songPlayer.currentTime = 0;
      lyricText.classList.remove('show');
      lyricText.textContent = '';
      seekRange.value = 0;
      curTimeEl.textContent = '0:00';
      hideFinal();
      if (progressRafId) {
        cancelAnimationFrame(progressRafId);
        progressRafId = null;
      }

      if (musicOn && musicStarted) {
        music.play().catch(() => {});
      }
    }

    replayBtn.addEventListener('click', () => {
      hideFinal();
      openPage2();
    });

    finalExitBtn.addEventListener('click', () => {
      hideFinal();
      closePage2();
    });

    function finalBurstHearts(count = 40) {
      if (prefersReducedMotion) return;
      const emojis = ['❤️', '💖', '💕', '💗', '💓', '💞', '✨', '💝', '🌸'];
      const centerX = window.innerWidth / 2;
      const centerY = window.innerHeight / 2;
      const fragment = document.createDocumentFragment();
      const created = [];

      for (let i = 0; i < count; i++) {
        const heart = document.createElement('div');
        heart.className = 'final-burst-heart';
        heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
        heart.style.left = centerX + 'px';
        heart.style.top = centerY + 'px';
        heart.style.fontSize = (16 + Math.random() * 26) + 'px';
        heart.style.transform = 'translate(-50%, -50%) scale(0.5)';
        heart.style.opacity = '1';
        heart.style.transition = 'transform 2s cubic-bezier(0.15, 0.6, 0.4, 1), opacity 2s ease-out';
        fragment.appendChild(heart);
        created.push(heart);
      }
      document.body.appendChild(fragment);

      created.forEach(heart => {
        const angle = Math.random() * Math.PI * 2;
        const distance = 150 + Math.random() * 250;
        const x = Math.cos(angle) * distance;
        const y = Math.sin(angle) * distance;

        requestAnimationFrame(() => {
          heart.style.transform = `translate(calc(-50% + ${x}px), calc(-50% + ${y}px)) scale(1.6) rotate(${Math.random() * 720}deg)`;
          heart.style.opacity = '0';
        });
        setTimeout(() => heart.remove(), 2200);
      });
    }

    document.getElementById('openPage2').addEventListener('click', openPage2);
    backBtn.addEventListener('click', closePage2);
  </script>
